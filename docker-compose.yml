services:
  mongodb:
    image: mongo:7
    container_name: medical-rag-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medical-rag-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - ai-service
    volumes:
      - ./backend/uploads:/app/uploads

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: medical-rag-ai-service
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service/storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medical-rag-frontend
    restart: unless-stopped
    ports:
      - "4173:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
